        - heading "Better trading is often less about finding more information and more about meeting your own process honestly." [level=2] [ref=e198]
      - generic [ref=e199]:
        - paragraph [ref=e200]: "Trading Journal is built for traders who want a private, evidence-based view of their decisions. We make room for the parts of a trade that a broker statement cannot show: intention, risk, discipline, and emotional state."
        - paragraph [ref=e201]: The aim is not perfection. It is a clearer blueprint for the next hundred trades.
